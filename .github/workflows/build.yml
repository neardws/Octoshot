name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  macos-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project (CI MLX stub)
        run: bash Scripts/ci-xcodegen.sh

      - name: Fetch llama-mtmd-cli
        run: bash Scripts/fetch-llama-mtmd.sh build/llama-mtmd

      - name: Test slim runtime packaging
        run: |
          bash Scripts/tests/test-slim-bundle.sh
          python3 -B -m unittest discover -s Scripts/tests -p 'test_*.py'

      - name: Build Octoshot
        run: |
          set -o pipefail
          DERIVED="$PWD/.derivedData"
          XCBUILD=(xcodebuild -derivedDataPath "$DERIVED" -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation)
          "${XCBUILD[@]}" -scheme octoshot-cli -configuration Debug build
          "${XCBUILD[@]}" -scheme Octoshot -configuration Debug build
          "${XCBUILD[@]}" -scheme OctoshotCoreTests -configuration Debug test
        env:
          NSUnbufferedIO: "YES"

      - name: Verify embedded CLI helper
        run: |
          set -euo pipefail
          APP_PATH="$PWD/.derivedData/Build/Products/Debug/Octoshot.app"
          if [ -z "$APP_PATH" ]; then
            echo "Octoshot.app not found in DerivedData"
            exit 1
          fi
          CLI="$APP_PATH/Contents/Helpers/octoshot"
          test -f "$CLI"
          test -x "$CLI"
          "$CLI" --help
          echo "Verified: $CLI --help"
          MTMD="$APP_PATH/Contents/Helpers/llama-mtmd-cli"
          test -x "$MTMD"
          "$MTMD" --help >/dev/null
          test -L "$APP_PATH/Contents/Helpers/libggml.dylib"
          test ! -e "$APP_PATH/Contents/Helpers/libllama-server-impl.dylib"
          echo "Verified: bundled llama-mtmd-cli"
