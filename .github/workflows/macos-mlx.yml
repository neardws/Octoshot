name: Build (full MLX)

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  macos-mlx:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: bash Scripts/fetch-llama-mtmd.sh build/llama-mtmd
      - name: Build Octoshot with mlx-swift-lm
        run: |
          set -o pipefail
          DERIVED="$PWD/.derivedData-mlx"
          xcodebuild \
            -derivedDataPath "$DERIVED" \
            -scheme Octoshot \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            build
        env:
          NSUnbufferedIO: "YES"
      - name: Verify embedded helpers
        run: |
          set -euo pipefail
          HELPERS="$PWD/.derivedData-mlx/Build/Products/Debug/Octoshot.app/Contents/Helpers"
          "$HELPERS/octoshot" --help
          "$HELPERS/llama-mtmd-cli" --help >/dev/null
          test -L "$HELPERS/libggml.dylib"
          test ! -e "$HELPERS/libllama-server-impl.dylib"
